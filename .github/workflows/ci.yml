name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm version comes from the "packageManager" field in package.json
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Typecheck (tsc --noEmit)
        run: pnpm -r typecheck

      - name: Test
        run: pnpm test

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: packages/*/coverage
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: |
            packages/*/coverage
            packages/*/dist
          if-no-files-found: ignore
          retention-days: 7

  contract:
    name: contract · test · wasm
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust (wasm32v1-none)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/keylease-core

      # soroban-sdk 29 requires stellar-cli to produce a deployable wasm
      - name: Install stellar-cli
        run: |
          curl -sSL \
            https://github.com/stellar/stellar-cli/releases/download/v28.1.0/stellar-cli-28.1.0-x86_64-unknown-linux-gnu.tar.gz \
            -o /tmp/stellar-cli.tar.gz
          tar -xzf /tmp/stellar-cli.tar.gz -C /usr/local/bin stellar
          stellar --version

      - name: Contract unit tests
        run: cargo test --manifest-path contracts/keylease-core/Cargo.toml

      - name: Build contract wasm
        run: cd contracts/keylease-core && stellar contract build

      - name: Enforce contract wasm size budget
        env:
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          WASM="contracts/keylease-core/target/wasm32v1-none/release/keylease_core.wasm"
          if [ ! -f "$WASM" ]; then
            echo "::error::Built wasm artifact not found at $WASM"
            exit 1
          fi

          SIZE=$(wc -c < "$WASM")
          MAX_SIZE=20480 # 20 KB budget

          echo "Contract wasm size: ${SIZE} bytes (budget: ${MAX_SIZE} bytes / 20 KB)"

          # Check if the pull request carries the explicit override label
          if echo "$PR_LABELS" | grep -q "wasm-size-override"; then
            echo "⚠️ 'wasm-size-override' label detected on pull request. Bypassing size budget enforcement."
            exit 0
          fi

          if [ "$SIZE" -gt "$MAX_SIZE" ]; then
            echo "::error::Contract wasm (${SIZE} bytes) exceeds the budget of ${MAX_SIZE} bytes (20 KB)."
            echo "::error::To override this check for exceptional changes, add the 'wasm-size-override' label to the PR with a documented justification."
            exit 1
          fi

          echo "✅ Contract wasm is within budget (${SIZE} <= ${MAX_SIZE} bytes)."

      - name: Upload contract wasm
        uses: actions/upload-artifact@v4
        with:
          name: keylease-core-wasm
          path: contracts/keylease-core/target/wasm32v1-none/release/keylease_core.wasm
          if-no-files-found: error
          retention-days: 30
